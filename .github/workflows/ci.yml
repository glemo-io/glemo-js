name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        # 22, not 20: package.json pins pnpm@11.5.2, which loads node:sqlite. That
        # builtin does not exist before Node 22, so pnpm crashed on startup and this
        # workflow had been failing since the pin, before it ran a single check.
        # release.yml already said 22; this one was left behind.
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm check:pack # publint + are-the-types-wrong on both packages
      - run: pnpm test
      # Every PR that changes a published package must ship a changeset.
      - if: github.event_name == 'pull_request'
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
